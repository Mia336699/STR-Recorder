name: Desktop source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop-and-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - name: Desktop UI behavior and locale contracts
        run: node --experimental-strip-types --test desktop/tests/*.test.ts
      - uses: dtolnay/rust-toolchain@stable
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Backend tests including media fixtures
        run: cargo test --manifest-path backend/Cargo.toml --lib --test public_hls_recording --test live_preview -- --include-ignored
      - name: Post-processing filename compatibility
        run: cargo test --manifest-path modules/pp_utils/Cargo.toml
      - name: Contact sheet encoder fallback
        run: cargo test --manifest-path modules/contact_sheet/Cargo.toml
