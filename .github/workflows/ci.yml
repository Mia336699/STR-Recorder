name: Desktop source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop-and-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - uses: dtolnay/rust-toolchain@stable
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Backend tests including media fixtures
        run: cargo test --manifest-path backend/Cargo.toml --lib --test public_hls_recording -- --include-ignored
